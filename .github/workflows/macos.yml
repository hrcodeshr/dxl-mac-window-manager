name: macOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Swift version
        run: swift --version

      - name: Test
        run: swift run DXLSnapCoreCheck

      - name: Package app
        run: bash scripts/package-app.sh

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: DXL-Window-Manager
          path: dist/DXL Window Manager.app
